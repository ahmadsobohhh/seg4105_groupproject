<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bug Triage</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f8; color: #182536; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 3rem auto; padding: 0 1.25rem; }
  h1, h2 { line-height: 1.15; letter-spacing: -.025em; }
  h1 { font-size: 2.4rem; margin-bottom: .6rem; }
  p { color: #42546b; }
  form, section { background: white; padding: 1.5rem; border: 1px solid #dce3ec; border-radius: 12px; }
  label { display: block; font-weight: 650; margin-bottom: .35rem; }
  input, textarea { display: block; width: 100%; margin-bottom: 1.15rem; padding: .65rem;
    border: 1px solid #728398; border-radius: 6px; font: inherit; }
  textarea { resize: vertical; }
  button { border: 0; border-radius: 6px; padding: .65rem 1rem; font: inherit;
    font-weight: 650; color: white; background: #17468e; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #feedback:not(:empty) { color: #a22222; }
  dl { display: grid; grid-template-columns: minmax(100px, 1fr) 2fr; gap: .5rem 1rem; }
  dt { font-weight: 650; }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
<main>
  <h1>Bug Triage</h1>
  <p>Submit a synthetic bug report and review its suggested classification, severity, and assignment.</p>
  <form>
    <label for="title">Title</label>
    <input id="title" name="title" maxlength="160" placeholder="Login page times out" required>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="5" maxlength="4000" required></textarea>
    <button type="submit">Get recommendation</button>
    <p id="feedback" role="alert"></p>
  </form>
  <section hidden aria-live="polite" aria-labelledby="result-title">
    <h2 id="result-title">Triage recommendation</h2>
    <p id="report"></p>
    <dl id="result"></dl>
    <p>Review these suggestions before routing the ticket.</p>
  </section>
</main>
<script>
  const form = document.querySelector("form");
  const button = form.querySelector("button");
  const feedback = document.querySelector("#feedback");
  const section = document.querySelector("section");
  const result = document.querySelector("#result");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    feedback.textContent = "";
    section.hidden = true;
    button.disabled = true;
    try {
      const payload = Object.fromEntries(new FormData(form));
      const response = await fetch("/api/reports", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const report = await response.json();
      if (!response.ok) throw new Error(report.error || "Could not process the report.");
      document.querySelector("#report").textContent = "#" + report.id + " " + report.title;
      const duplicate = report.possible_duplicate;
      const fields = {
        Category: report.category,
        Severity: report.severity,
        "Suggested team": report.team,
        Summary: report.summary,
        "Possible duplicate": duplicate ? "#" + duplicate.id + " " + duplicate.title : "None found"
      };
      result.replaceChildren();
      for (const [label, value] of Object.entries(fields)) {
        const term = document.createElement("dt");
        const detail = document.createElement("dd");
        term.textContent = label;
        detail.textContent = value;
        result.append(term, detail);
      }
      section.hidden = false;
    } catch (error) {
      feedback.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
